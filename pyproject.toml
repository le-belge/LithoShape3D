[project]
name = "lithoshape3d"
version = "0.1.0"
description = "Generateur de lithophanies et reliefs 3D a partir d'images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "trimesh>=4.0",
    "manifold3d>=2.5",
]

[project.optional-dependencies]
viewer = [
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
]
ui = [
    "pyside6>=6.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
lithoshape3d = "lithoshape3d.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lithoshape3d"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
