[project]
name = "lithoshape3d"
dynamic = ["version"]
description = "Generateur de lithophanies et reliefs 3D a partir d'images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "trimesh>=4.0",
    "manifold3d>=2.5",
    "scipy>=1.11",
    "lxml>=5.0",
    "networkx>=3.0",
    "fonttools>=4.50",
    "shapely>=2.0",
    "svgpathtools>=1.6",
]

[project.optional-dependencies]
viewer = [
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
]
ui = [
    "pyside6>=6.6",
]
ai = [
    "coremltools>=8.0",
    "huggingface_hub>=0.24",
]
app = [
    "lithoshape3d[viewer,ui]",
]
packaging = [
    # Uniquement pour regenerer les icones natives (packaging/generate_icons.py)
    # depuis le logo SVG -- jamais importe par l'application elle-meme.
    "cairosvg>=2.7",
]
app-full = [
    "lithoshape3d[viewer,ui,ai]",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
lithoshape3d = "lithoshape3d.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lithoshape3d"]

[tool.hatch.version]
path = "src/lithoshape3d/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
